<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The app has its own light and dark themes. Stop browser/extension auto-darkening
         (Chrome "auto dark mode", Dark Reader) from recolouring it on top. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="darkreader-lock" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#121417" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Case Planner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Case Layout Planner</title>
    <meta name="description" content="Plan a Pelican case interior to scale: pick the case and divider style, lay out your gear, and get a TrekPak cut list and a 1:1 printable template." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 24'%3E%3Crect x='1' y='3' width='30' height='20' rx='4' fill='%23f5b301'/%3E%3Cpath d='M12 8v11M12 13h15' stroke='%23111' stroke-width='2.4'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint so there's no flash.
      try {
        var t = localStorage.getItem('pcp.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
